<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>HSB 包裝掃碼</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0b0e;color:white;font:16px system-ui,sans-serif}
video,svg{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
svg{z-index:1}.guide{position:fixed;top:48%;left:50%;transform:translate(-50%,-50%);width:min(62vw,42vh);aspect-ratio:1;border:2px solid #ffd826;border-radius:16px;pointer-events:none}
.guide[hidden]{display:none}.success{position:fixed;top:48%;left:50%;transform:translate(-50%,-50%);color:#7bffa9;background:#143722;border-radius:50%;padding:.15em .45em;font-size:3rem;z-index:2}
header,footer{position:fixed;z-index:3;left:0;right:0;padding:16px;background:#0a0b0ee8}
header{top:0;padding-top:max(16px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
footer{bottom:0;padding-bottom:max(16px,env(safe-area-inset-bottom));text-align:center}
button{border:0;border-radius:10px;padding:10px 15px;background:#fff;color:#13161e;font:inherit}
output{display:block;font-weight:bold;overflow-wrap:anywhere}pre{white-space:pre-wrap;text-align:left}p{margin:.45em 0}
</style>
<video id="video" autoplay muted playsinline></video>
<div id="guide" class="guide" aria-hidden="true"></div>
<svg id="points" aria-hidden="true"></svg>
<div id="success" class="success" hidden aria-hidden="true">✓</div>
<header><strong>HSB 包裝掃碼</strong><button id="back" type="button">取消／返回</button></header>
<footer>
  <p id="status" role="status" aria-live="polite">正在開啟後置相機…</p>
  <output id="result" hidden></output>
  <button id="start" type="button" hidden>開啟相機</button>
  <button id="copy" type="button" hidden>複製包裝 ID</button>
  <pre id="debug" hidden></pre>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.hash.slice(1));
const nonce=params.get('hsb')||'';
const target=params.get('origin')||'';
const openerWindow=/^[0-9a-f-]{36}$/i.test(nonce)&&
  /^https:\/\/(?:script\.google\.com|(?:[a-z0-9-]+\.)?script\.googleusercontent\.com|[a-z0-9-]+-script\.googleusercontent\.com)$/i.test(target)
  ?window.opener:null;
const video=$('video');
const debug=new URLSearchParams(location.search).get('debug')==='1';
$('debug').hidden=!debug;
const log=value=>{if(debug)$('debug').textContent=String(value);};
const status=value=>{$('status').textContent=value;};
let controls, starting=false, finished=false, stopped=false, id='', timer, accepted=false, lastError=0;
function stop(){
  controls?.stop();
  video.srcObject?.getTracks().forEach(track=>track.stop());
}
function leave(){
  stopped=true;
  clearTimeout(timer);
  stop();
  window.close();
  if(history.length>1)setTimeout(()=>history.back(),200);
  else status('請關閉此分頁，切回 HSB 庫存管理。');
}
window.addEventListener('pagehide',()=>{stopped=true;stop();});
$('back').onclick=leave;
function send(type,extra={}){
  openerWindow?.postMessage({type,nonce,...extra},target);
}
window.addEventListener('message',event=>{
  if(!openerWindow||event.source!==openerWindow||event.origin!==target||event.data?.nonce!==nonce)return;
  if(event.data.type==='hsb.scan.ready-ack')log('已連線至 HSB');
  if(event.data.type!=='hsb.scan.ack'||!id||accepted)return;
  clearTimeout(timer);
  if(event.data.accepted){
    accepted=true;
    status('已帶入 HSB。若分頁未關閉，請返回原分頁。');
    setTimeout(()=>window.close(),350);
  }else status('HSB 未帶入此包裝。請返回查看原因，或複製包裝 ID。');
});
function drawPoints(result){
  const points=result.getResultPoints?.()||[];
  if(!video.videoWidth||!video.videoHeight||points.length<3)return;
  const svg=$('points');
  svg.setAttribute('viewBox','0 0 '+video.videoWidth+' '+video.videoHeight);
  // ZXing reports finder centers, not the four outer corners.
  for(const point of points){
    const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',point.getX());
    circle.setAttribute('cy',point.getY());
    circle.setAttribute('r','12');
    circle.setAttribute('fill','none');
    circle.setAttribute('stroke','#ffd826');
    circle.setAttribute('stroke-width','4');
    svg.append(circle);
  }
}
function decoded(result,active){
  if(stopped||finished)return;
  const text=result.getText().trim().toUpperCase();
  if(!/^(?:PK|D)\d{4,16}$/.test(text)){
    status('這不是 HSB 包裝標籤。請繼續掃描。');
    log('原始內容：'+result.getText());
    return;
  }
  finished=true;
  id=text;
  drawPoints(result);
  $('guide').hidden=true;
  $('success').hidden=false;
  $('result').textContent=id;
  $('result').hidden=$('copy').hidden=false;
  active?.stop();
  video.srcObject?.getTracks().forEach(track=>track.stop());
  if(!openerWindow){
    status('無法連到 HSB。請複製包裝 ID，再回原分頁手動輸入。');
    return;
  }
  status('正在等待 HSB 確認…');
  timer=setTimeout(()=>status('尚未收到 HSB 確認。請返回原分頁查看，或複製包裝 ID。'),12000);
  send('hsb.scan.result',{id});
}
async function focusCamera(track){
  if(!track)return;
  const caps=track.getCapabilities?.()||{};
  log(JSON.stringify(track.getSettings?.()||{},null,2));
  if(caps.focusMode?.includes('continuous')&&track.applyConstraints){
    try{await track.applyConstraints({advanced:[{focusMode:'continuous'}]});}
    catch(error){log('連續對焦未套用：'+error.message);}
  }
}
async function start(){
  if(starting||finished||stopped)return;
  starting=true;
  $('start').hidden=true;
  try{
    if(!globalThis.ZXingBrowser?.BrowserQRCodeReader)throw new Error('ZXing 載入失敗，請檢查網路後重新開啟掃碼頁。');
    const reader=new ZXingBrowser.BrowserQRCodeReader();
    controls=await reader.decodeFromConstraints({audio:false,video:{
      facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}
    }},video,(result,error,active)=>{
      if(result){decoded(result,active);return;}
      if(debug&&error&&Date.now()-lastError>800){
        lastError=Date.now();
        log(JSON.stringify(video.srcObject?.getVideoTracks()[0]?.getSettings?.()||{},null,2)+
          '\n'+error.name+': '+error.message);
      }
    });
    if(stopped||finished){stop();return;}
    status('請讓 QR Code 對準黃框。若失焦，請稍微拉遠再靠近。');
    await focusCamera(video.srcObject?.getVideoTracks()[0]);
  }catch(error){
    stop();
    if(stopped||finished)return;
    status('無法開啟相機。請檢查瀏覽器相機權限，或返回使用拍照辨識。');
    log(error.name+': '+error.message);
    $('start').hidden=false;
  }finally{starting=false;}
}
$('start').onclick=start;
$('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(id);status('已複製 '+id+'。');}
  catch(_){status('請長按包裝 ID 複製，或在 HSB 手動輸入。');}
};
send('hsb.scan.ready');
start();
</script>
</html>
